{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "loommq.fullname" . }}
  labels:
    {{- include "loommq.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "loommq.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.mqttPort }}
        - protocol: TCP
          port: {{ .Values.service.metricsPort }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}

{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "loommq.fullname" . }}-secret
  labels:
    {{- include "loommq.labels" . | nindent 4 }}
type: Opaque
stringData:
  bootstrap-username: {{ .Values.bootstrapAdmin.username | quote }}
  bootstrap-password: {{ .Values.bootstrapAdmin.password | quote }}
{{- end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "loommq.fullname" . }}
  labels:
    {{- include "loommq.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.mqttPort }}
      targetPort: mqtt
      protocol: TCP
      name: mqtt
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "loommq.selectorLabels" . | nindent 4 }}

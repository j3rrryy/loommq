apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "loommq.fullname" . }}-test-connection"
  labels:
    {{- include "loommq.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: [ 'wget' ]
      args: [ '-qO-', 'http://{{ include "loommq.fullname" . }}:{{ .Values.service.metricsPort }}/health/ready' ]
  restartPolicy: Never

replicaCount: 1

image:
  repository: ghcr.io/j3rrryy/loommq
  pullPolicy: IfNotPresent
  tag: ""

serviceAccount:
  create: true
  automountServiceAccountToken: false

service:
  type: ClusterIP
  mqttPort: 1883
  metricsPort: 8080

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

javaOpts: "-XX:+UseZGC -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

startupProbe:
  enabled: true
  failureThreshold: 30
  periodSeconds: 2

bootstrapAdmin:
  username: "admin"
  password: "admin"

existingSecret: ""
existingConfigMap: ""

config: { }
